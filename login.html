<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EZet-Up</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Your existing CSS -->
    <link rel="stylesheet" href="../user/css/user.css">
        <link rel="icon" type="image/x-icon" style="height: auto;" href="../img/logo.png">


    <style>

        /* ==============================
           LOGIN PAGE
        ============================== */

        body {
            min-height: 100vh;
            background: #f5f7fb;
            color: #14213d;
            font-family: 'Inter', sans-serif;
        }

        /* Navbar */

        .navbar {
            min-height: 88px;
            background: #ffffff !important;
        }

        .navbar-brand img {
            width: 75px;
            height: auto;
            object-fit: contain;
        }

        .login-nav {
            font-family: 'JetBrains Mono', monospace;
            font-size: .82rem;
        }

        .login-nav .nav-link {
            color: #14213d;
            padding: 8px 14px;
            transition: .2s ease;
        }

        .login-nav .nav-link:hover {
            color: #2563eb;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        /* Main */

        .login-wrapper {
            min-height: calc(100vh - 88px - 76px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        /* Login Card */

        .login-card {
            width: 100%;
            max-width: 535px;
            background: #ffffff;
            border: 1px solid #dfe3ea;
            border-radius: 10px;
            padding: 34px;
            box-shadow: 0 8px 25px rgba(20, 33, 61, 0.08);
        }

        /* Lock Icon */

        .login-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #e8efff;
            color: #2563eb;

            font-size: 28px;
        }

        /* Heading */

        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 32px;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #65748b;
            text-align: center;
            margin-bottom: 34px;
        }

        /* Labels */

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #14213d;
            margin-bottom: 8px;
        }

        /* Inputs */

        .input-group {
            position: relative;
        }

        .input-group .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 5;
        }

        .form-control {
            height: 46px;
            border: 1px solid #d9dee7;
            border-radius: 7px !important;
            padding-left: 46px;
            padding-right: 45px;
            font-size: 14px;
            color: #14213d;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .10);
        }

        .form-control::placeholder {
            color: #9aa7ba;
        }

        /* Password button */

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;
            color: #94a3b8;

            cursor: pointer;
            z-index: 5;
        }

        .password-toggle:hover {
            color: #2563eb;
        }

        /* Remember / Forgot */

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #65748b;
            cursor: pointer;
        }

        .remember-label input {
            width: 19px;
            height: 19px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        .forgot-link,
        .signup-link {
            color: #2563eb;
            text-decoration: none;
        }

        .forgot-link:hover,
        .signup-link:hover {
            text-decoration: underline;
        }

        /* Sign in button */

        .login-submit {
            width: 100%;
            height: 46px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: 500;
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            color: #7b8798;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #dfe3ea;
            flex: 1;
        }

        /* Google */

        .google-btn {
            width: 100%;
            height: 46px;

            background: #ffffff;
            border: 1px solid #d9dee7;
            border-radius: 7px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            color: #4b5b73;
            font-size: 14px;

            transition: .2s ease;
        }

        .google-btn:hover {
            background: #f8fafc;
            border-color: #c7cfdb;
        }

        .google-icon {
            font-weight: 700;
            font-size: 19px;
            color: #4285f4;
        }

        /* Signup */

        .signup-text {
            text-align: center;
            color: #65748b;
            font-size: 14px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        /* Footer */

        .login-footer {
            border-top: 1px solid #dfe3ea;
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #53657d;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 767px) {

            .navbar {
                min-height: 75px;
            }

            .login-wrapper {
                min-height: auto;
                padding: 35px 15px;
            }

            .login-card {
                padding: 28px 22px;
            }

            .login-title {
                font-size: 28px;
            }

            .login-options {
                font-size: 13px;
            }

            .login-footer {
                padding: 20px;
                text-align: center;
            }
        }

    </style>
</head>

<body>

    <main class="login-wrapper">

        <div class="login-card">

            <!-- Icon -->

            <div class="login-icon">
                <i class="fa-solid fa-lock"></i>
            </div>


            <!-- Heading -->

            <h1 class="login-title">
                Welcome back
            </h1>

            <p class="login-subtitle">
                Sign in to your EZet-Up account to continue
            </p>


            <!-- Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="mb-4">

                    <label for="email" class="form-label">
                        Email address
                    </label>

                    <div class="input-group">

                        <i class="fa-regular fa-envelope input-icon"></i>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- Password -->

                <div class="mb-0">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->

                <div class="login-options">

                    <a href="forgot-password.html"
                       class="forgot-link">
                        Forgot password?
                    </a>

                </div>


                <!-- Sign In -->

                <button
                    type="submit"
                    class="btn btn-primary login-submit">

                    Sign in

                </button>

            </form>


            <!-- Divider -->

            <div class="divider">
                <span>or</span>
            </div>

            <!-- Signup -->

            <p class="signup-text">

                Don't have an account?

                <a href="register.html"
                   class="signup-link">
                    Sign up
                </a>

            </p>

        </div>

    </main>
    <!-- Bootstrap JS -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>


    <script>

        /* ==============================
           SHOW / HIDE PASSWORD
        ============================== */

        const togglePassword =
            document.getElementById("togglePassword");

        const password =
            document.getElementById("password");

        togglePassword.addEventListener("click", function () {

            const type =
                password.getAttribute("type") === "password"
                    ? "text"
                    : "password";

            password.setAttribute("type", type);

            const icon =
                this.querySelector("i");

            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");

        });


        /* ==============================
           LOGIN FORM
        ============================== */

        document.getElementById("loginForm").addEventListener("submit", function(e) {

            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            // Check if fields are empty
            if (!email || !password) {
                alert("Please enter your email and password.");
                return;
            }

            // Login successful
            window.location.href = "../pages/tutorial.html";

        });

    </script>

</body>
</html>
